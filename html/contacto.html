<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto · NeónTech</title>
  <link rel="icon" href="../imagenes/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/script.js" defer></script>
  <script src="../js/contacto.js" defer></script>
</head>
<body>
  <nav class="nav">
    <a href="../index.html"><img src="../imagenes/logo.svg" alt="NeónTech"></a>
    <a href="../index.html">Inicio</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="resenas.html">Reseñas</a>
    <a href="contacto.html" class="activo">Contacto</a>
    <a href="inventario.html">Inventario</a>
    <a href="carrito.html" class="carrito-link">🛒 Carrito <span id="contadorCarrito" class="contador">0</span></a>
  </nav>

  <main>
    <h1>Contacto y ayuda</h1>

    <section class="panel">
      <h2>Preguntas frecuentes</h2>
      <input type="text" id="buscarFaq" placeholder="Buscar en las preguntas...">
      <div id="listaFaq"></div>
    </section>

    <form id="formContacto" class="panel">
      <h2>Escríbenos</h2>
      <label for="contactoNombre">Nombre</label>
      <input type="text" id="contactoNombre">
      <label for="contactoCorreo">Correo</label>
      <input type="email" id="contactoCorreo">
      <label for="contactoMensaje">Mensaje</label>
      <textarea id="contactoMensaje" rows="4"></textarea>
      <p id="errorContacto" class="error"></p>
      <button type="submit" id="btnEnviar" class="btn-principal">Enviar mensaje</button>
    </form>
    <div id="respuestaContacto" class="mensaje"></div>
  </main>
</body>
</html>
